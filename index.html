<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b18">
<meta name="description" content="Void Invaders: a touch-first arcade space shooter. Three weapons, endless waves, and a boss every five waves.">
<title>VOID INVADERS · Touch Arcade</title>
<style>
:root{color-scheme:dark;--bg:#090b18;--panel:#111528;--border:#272c47;--text:#eef2ff;--muted:#929cb9;--cyan:#6cf5dd;--pink:#ff779c;--gold:#ffd38b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--border);background:var(--panel);border-radius:12px;min-height:44px;touch-action:none;-webkit-tap-highlight-color:transparent}button:hover{border-color:var(--cyan)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:active,.held{transform:translateY(1px);filter:brightness(1.3)}[hidden]{display:none!important}
.app{height:100vh;height:100dvh;max-width:680px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;grid-template-rows:auto auto minmax(140px,1fr) auto auto;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:16px;letter-spacing:2px}.brand span{color:var(--cyan)}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:8px}.icon{min-width:44px;font-size:19px}.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}.stat{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:#0e1122}.label{color:var(--muted);font-size:9px;letter-spacing:1.6px;font-weight:650}.value{font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:3px}.value.lives{color:var(--pink);letter-spacing:3px}
.arena{position:relative;min-height:0;border:1px solid #30364f;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#181a38,#090c1c 70%);touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.sector{position:absolute;left:14px;top:12px;font:9px ui-monospace,monospace;letter-spacing:2px;color:#6c7699;pointer-events:none}.message{position:absolute;top:42%;left:10px;right:10px;text-align:center;pointer-events:none;font:800 23px ui-monospace,monospace;letter-spacing:3px;text-shadow:0 0 20px #6cf5dd88;color:var(--cyan)}.message small{display:block;color:var(--muted);font:11px system-ui;margin-top:8px;letter-spacing:1px}.bossbar{position:absolute;top:27px;left:20%;right:20%;height:5px;background:#352334;border-radius:4px;overflow:hidden}.bossbar i{display:block;height:100%;width:100%;background:var(--pink)}
.controls{display:grid;gap:9px}.weapons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weapon{padding:8px 5px;text-align:left;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:3px 4px}.weapon b{font-size:11px;letter-spacing:.5px}.weapon small{grid-column:2;color:var(--muted);font-size:9px}.weapon .glyph{grid-row:span 2;font-size:19px;text-align:center}.weapon[aria-pressed=true]{border-color:var(--cyan);background:#123132;color:var(--cyan);box-shadow:inset 0 0 18px #6cf5dd09}.weapon[aria-pressed=true] small{color:#a0c7c4}.movement{display:grid;grid-template-columns:1fr 1fr 2fr;gap:9px}.direction{font-size:25px;min-height:58px}.fire{background:var(--cyan);color:#06251f;border-color:var(--cyan);font-size:15px;font-weight:850;letter-spacing:1.5px;min-height:58px;box-shadow:0 0 24px #6cf5dd15}.fire small{display:block;font-size:8px;letter-spacing:1.3px;margin-top:3px}.left-handed .fire{grid-column:1;grid-row:1}.left-handed .movement{grid-template-columns:2fr 1fr 1fr}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:.5px;gap:8px}.footer b{color:var(--gold)}
.overlay{position:fixed;inset:0;z-index:10;background:#070a15b8;backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px;overflow:auto}.card{width:min(100%,420px);padding:30px 26px;border:1px solid #38435c;border-radius:24px;background:linear-gradient(145deg,#181e34,#0e1325);box-shadow:0 28px 100px #0008}.badge{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:750}.card h1{font-size:42px;line-height:1;letter-spacing:-2px;margin:18px 0}.card h1 span{color:var(--cyan)}.card h2{font-size:27px;margin:14px 0}.card p{color:#aeb7cf;font-size:14px;line-height:1.65}.hero-ship{font-size:38px;color:var(--cyan);margin:12px 0;text-shadow:0 0 28px #6cf5dd88}.instructions{display:grid;gap:10px;margin:22px 0;font-size:12px;color:#c1cadf}.instructions span{color:var(--cyan);display:inline-block;width:24px}.primary{width:100%;background:var(--cyan);border-color:var(--cyan);color:#092c26;font-weight:800;letter-spacing:1px;margin-top:12px;min-height:52px}.secondary{width:100%;margin-top:10px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid var(--border);font-size:13px}.setting input[type=checkbox]{width:22px;height:22px;accent-color:var(--cyan)}.setting input[type=range]{width:125px;accent-color:var(--cyan)}.setting select{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:8px}.result{display:flex;justify-content:space-between;padding:16px 0;border-block:1px solid var(--border);color:var(--muted)}.result strong{color:var(--gold);font:750 24px ui-monospace,monospace}.fine{font-size:10px!important;color:var(--muted)!important}
@media (orientation:landscape) and (min-width:650px){.app{max-width:1100px;grid-template-columns:minmax(300px,1fr) 210px;grid-template-rows:auto auto minmax(120px,1fr) auto;gap:8px}header,.hud{grid-column:1/-1}.arena{grid-column:1;grid-row:3/5}.controls{grid-column:2;grid-row:3;align-content:center}.weapons{grid-template-columns:1fr}.weapon{padding:7px 12px}.movement{grid-template-columns:1fr 1fr}.fire{grid-column:1/-1}.left-handed .movement{grid-template-columns:1fr 1fr}.left-handed .fire{grid-column:1/-1;grid-row:2}.footer{grid-column:2;grid-row:4;flex-direction:column;padding-bottom:5px}.card{padding:20px 26px}.card h1{font-size:32px;margin:10px 0}.hero-ship{display:none}.instructions{margin:12px 0;gap:7px}.card p{margin:10px 0}.overlay{padding:12px}.stat{padding:5px 12px}.value{font-size:17px}}
@media (max-height:620px) and (orientation:portrait){.app{gap:6px;padding-top:6px}.eyebrow{display:none}.stat{padding:5px 9px}.value{font-size:16px}.direction,.fire{min-height:48px}.weapon{padding:5px}.footer{font-size:8px}}
@media (orientation:landscape) and (min-width:650px){.app{grid-template-rows:auto auto minmax(120px,1fr)}.arena,.controls{grid-row:3}.controls{gap:6px;min-height:0}.weapons{gap:6px}.weapon{min-height:36px;padding:4px 12px}.movement{gap:6px}.direction{min-height:38px}.fire{min-height:44px}.footer{display:none}}
@media (orientation:landscape) and (max-height:360px){.app{padding-top:6px;padding-bottom:6px;gap:6px}.eyebrow,.hud .label{display:none}.icon{min-height:32px;min-width:36px}.stat{padding:4px 10px}.value{margin-top:0;font-size:16px}}
@media(prefers-reduced-motion:reduce){button{transform:none!important}.overlay{backdrop-filter:none}}
</style>
</head>
<body>
<main class="app" id="app">
 <header><div><div class="brand">VOID <span>INVADERS</span></div><div class="eyebrow">DEEP SPACE · ARCADE DEFENSE</div></div><div class="toolbar"><button class="icon" id="pause" aria-label="Pause game">Ⅱ</button><button class="icon" id="settings" aria-label="Open settings">⚙</button></div></header>
 <div class="hud" aria-label="Game status"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">000000</div></div><div class="stat"><div class="label">WAVE</div><div class="value" id="wave">01</div></div><div class="stat"><div class="label">HULL</div><div class="value lives" id="lives" aria-label="3 lives">♥♥♥</div></div></div>
 <section class="arena" id="arena" aria-label="Game field: drag to move your ship"><canvas id="game" aria-label="Void Invaders game field"></canvas><div class="sector" id="sector">SECTOR 001</div><div class="bossbar" id="bossbar" hidden><i id="bosshealth"></i></div><div class="message" id="message" hidden></div></section>
 <div class="controls"><div class="weapons" role="group" aria-label="Choose weapon"><button class="weapon" data-weapon="pulse" aria-pressed="true"><span class="glyph">⌁</span><b>PULSE</b><small>Unlimited</small></button><button class="weapon" data-weapon="grenade" aria-pressed="false"><span class="glyph">✺</span><b>GRENADE</b><small id="ammo">4 charges</small></button><button class="weapon" data-weapon="laser" aria-pressed="false"><span class="glyph">ϟ</span><b>LASER</b><small id="energy">100% energy</small></button></div><div class="movement"><button class="direction" id="left" aria-label="Move left">‹</button><button class="direction" id="right" aria-label="Move right">›</button><button class="fire" id="fire">FIRE <small>PRESS & HOLD</small></button></div></div>
 <div class="footer"><span>DRAG TO MOVE · HOLD TO FIRE</span><span>BEST <b id="best">000000</b></span></div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="card" id="card"></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), random=(a,b)=>a+Math.random()*(b-a);
const storage={get(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}};
const prefs=Object.assign({sound:true,effects:!matchMedia('(prefers-reduced-motion: reduce)').matches,leftHanded:false,sensitivity:1,difficulty:'standard'},storage.get('void.settings',{}));
let best=Number(storage.get('void.best',0))||0, W=480,H=620,dpr=1, state='menu', screen='menu', weapon='pulse', game=null, last=0, audio=null, previousFocus=null;
const keys=new Set(), held={left:new Set(),right:new Set(),fire:new Set()}, stars=Array.from({length:85},()=>({x:Math.random(),y:Math.random(),z:random(.3,1)}));
let drag=null, resumeAfterSettings=false;
function applyPrefs(){ $('app').classList.toggle('left-handed',!!prefs.leftHanded);storage.set('void.settings',prefs) }
function tone(freq=400,duration=.06,type='sine',volume=.045){if(!prefs.sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.4),audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function clearInput(){keys.clear();for(const group of Object.values(held))group.clear();drag=null;document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'))}
function resize(){const r=canvas.getBoundingClientRect(),old=H;H=clamp(Math.round(W*r.height/Math.max(1,r.width)),230,850);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);if(game){game.player.y=H-32;for(const p of [...game.shots,...game.enemyShots,...game.drops,...game.particles])p.y*=H/old;for(const e of game.enemies)e.y*=H/old;if(game.boss)game.boss.y*=H/old}}
new ResizeObserver(resize).observe(canvas);
function displayDialog(html,type){clearInput();screen=type;previousFocus=document.activeElement;$('card').innerHTML=html;$('overlay').hidden=false;requestAnimationFrame(()=>$('card').querySelector('button,input,select')?.focus())}
function closeDialog(){ $('overlay').hidden=true;previousFocus?.focus();screen=null }
function menu(){state='menu';displayDialog('<div class="badge">THE VOID IS CALLING</div><div class="hero-ship">✧</div><h1 id="dialog-title">VOID<br><span>INVADERS</span></h1><p>A lone ship. An endless invasion.<br>How long can you hold the line?</p><div class="instructions"><div><span>↔</span> Drag your ship or hold the arrow buttons</div><div><span>ϟ</span> Hold FIRE and switch weapons anytime</div><div><span>✺</span> A boss awaits every fifth wave</div></div><button class="primary" id="start">LAUNCH MISSION →</button><button class="secondary" id="menu-settings">Settings</button><p class="fine">Touch, mouse, or keyboard · No download needed</p>','menu');$('start').onclick=start;$('menu-settings').onclick=openSettings}
function start(){tone(660,.12);game={score:0,wave:0,lives:3,player:{x:W/2,y:H-32,target:W/2,invincible:1.8},enemies:[],shots:[],enemyShots:[],particles:[],drops:[],boss:null,grenades:4,energy:100,cooldown:0,laserSound:0,laserActive:false,direction:1,enemyTimer:1,waveTimer:0,shake:0,time:0};weapon='pulse';chooseWeapon('pulse');state='playing';closeDialog();nextWave();updateHUD()}
function showMessage(title,detail){$('message').replaceChildren();$('message').append(document.createTextNode(title));const small=document.createElement('small');small.textContent=detail;$('message').append(small);$('message').hidden=false}
function nextWave(){game.wave++;game.grenades=Math.min(8,game.grenades+ (game.wave===1?0:3));game.energy=100;game.enemyShots=[];game.shots=[];game.drops=[];game.waveTimer=1.6;game.direction=1;game.enemyTimer=1.2;game.player.invincible=Math.max(game.player.invincible,1.6);
 if(game.wave%5===0){const hp=65+game.wave*7;game.boss={x:W/2,y:Math.min(70,H*.25),r:44,hp,maxHP:hp,t:0,timer:1.3};showMessage('WARNING: DREADNOUGHT','Break its armor. Hold your ground.');tone(100,.5,'sawtooth',.07)}
 else{const rows=Math.min(4,2+Math.floor(game.wave/3)),cols=6;for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){const type=row===0&&game.wave>=3?'armored':row===rows-1?'scout':'drone';game.enemies.push({x:65+col*70,y:45+row*Math.min(38,H*.09),r:14,type,hp:type==='armored'?3:type==='drone'?2:1,maxHP:type==='armored'?3:type==='drone'?2:1,phase:random(0,6),flash:0})}showMessage('WAVE '+String(game.wave).padStart(2,'0'),'Weapons recharged · Stay sharp');tone(520,.2)}updateHUD()}
function chooseWeapon(name){weapon=name;document.querySelectorAll('[data-weapon]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.weapon===weapon)));if(state==='playing')tone(320,.03)}
function updateHUD(){if(!game)return;$('score').textContent=String(game.score).padStart(6,'0');$('wave').textContent=String(game.wave).padStart(2,'0');$('sector').textContent='SECTOR '+String(game.wave).padStart(3,'0');$('lives').textContent='♥'.repeat(game.lives)+'♡'.repeat(3-game.lives);$('lives').setAttribute('aria-label',game.lives+' lives');$('ammo').textContent=game.grenades+' charges';$('energy').textContent=Math.ceil(game.energy)+'% energy';$('best').textContent=String(best).padStart(6,'0');$('bossbar').hidden=!game.boss;$('bosshealth').style.width=game.boss?100*game.boss.hp/game.boss.maxHP+'%':'0%'}
function rememberBest(){if(game.score>best){best=game.score;storage.set('void.best',best)}$('best').textContent=String(best).padStart(6,'0')}
function pause(){if(state!=='playing')return;state='paused';displayDialog('<div class="badge">MISSION ON HOLD</div><h2 id="dialog-title">Take a breather.</h2><p>Wave '+game.wave+' · Score '+game.score.toLocaleString()+'</p><button class="primary" id="resume">RESUME MISSION</button><button class="secondary" id="pause-settings">Settings</button><button class="secondary" id="quit">End mission</button>','paused');$('resume').onclick=resume;$('pause-settings').onclick=openSettings;$('quit').onclick=()=>{rememberBest();menu()}}
function resume(){clearInput();state='playing';last=performance.now();closeDialog()}
function openSettings(){if(screen==='settings')return;resumeAfterSettings=state==='playing';if(resumeAfterSettings)state='paused';displayDialog('<div class="badge">FLIGHT CONFIGURATION</div><h2 id="dialog-title">Settings</h2><label class="setting">Sound effects<input id="sound-setting" type="checkbox" '+(prefs.sound?'checked':'')+'></label><label class="setting">Particles & screen shake<input id="effects-setting" type="checkbox" '+(prefs.effects?'checked':'')+'></label><label class="setting">Fire button on left<input id="hand-setting" type="checkbox" '+(prefs.leftHanded?'checked':'')+'></label><label class="setting">Drag sensitivity<input id="sensitivity-setting" type="range" min="0.5" max="1.5" step="0.1" value="'+prefs.sensitivity+'"></label><label class="setting">Difficulty<select id="difficulty-setting" '+(game&&state==='paused'?'disabled':'')+'><option value="standard">Standard</option><option value="chill">Chill</option></select></label><p class="fine">Chill slows enemies and incoming fire. Difficulty is selected before launch. Other settings apply immediately.</p><button class="primary" id="settings-done">DONE</button>','settings');$('difficulty-setting').value=prefs.difficulty;
 const bindings=[['sound-setting','sound'],['effects-setting','effects'],['hand-setting','leftHanded']];for(const [id,key]of bindings)$(id).onchange=e=>{prefs[key]=e.target.checked;applyPrefs()};$('sensitivity-setting').oninput=e=>{prefs.sensitivity=Number(e.target.value);applyPrefs()};$('difficulty-setting').onchange=e=>{prefs.difficulty=e.target.value;applyPrefs()};$('settings-done').onclick=()=>{if(resumeAfterSettings)resume();else if(state==='paused'){state='playing';pause()}else menu()}}
function gameOver(){state='over';rememberBest();clearInput();tone(130,.5,'triangle',.08);displayDialog('<div class="badge">SIGNAL LOST · MISSION COMPLETE</div><h2 id="dialog-title">You held the line.</h2><p>You reached wave '+game.wave+'. The void will remember.</p><div class="result"><span>FINAL SCORE<br><strong>'+game.score.toLocaleString()+'</strong></span><span>PERSONAL BEST<br><strong>'+best.toLocaleString()+'</strong></span></div><button class="primary" id="retry">LAUNCH AGAIN →</button><button class="secondary" id="back-menu">Main menu</button>','over');$('retry').onclick=start;$('back-menu').onclick=menu}
function burst(x,y,color,count=12){if(!prefs.effects)return;for(let i=0;i<count;i++)game.particles.push({x,y,vx:random(-100,100),vy:random(-100,100),life:random(.15,.5),max:.5,color});if(game.particles.length>350)game.particles.splice(0,game.particles.length-350)}
function award(points,x,y){game.score+=points;burst(x,y,'#6cf5dd');if(Math.random()<.065)game.drops.push({x,y,r:10,kind:Math.random()<.4?'repair':'charge'});tone(180,.06,'triangle');updateHUD()}
function hurtPlayer(){if(game.player.invincible>0||state!=='playing')return;game.lives--;game.player.invincible=2.2;game.shake=.3;burst(game.player.x,game.player.y,'#ff779c',28);tone(90,.22,'sawtooth');updateHUD();if(game.lives<=0)gameOver()}
function damageEnemy(e,amount){if(e.hp<=0)return;e.hp-=amount;e.flash=.07;if(e.hp<=0)award(e.type==='armored'?60:e.type==='drone'?30:20,e.x,e.y)}
function damageBoss(amount){const b=game.boss;if(!b)return;b.hp-=amount;if(b.hp<=0){game.score+=500+game.wave*50;burst(b.x,b.y,'#ff779c',60);game.boss=null;game.lives=Math.min(3,game.lives+1);game.grenades=Math.min(8,game.grenades+2);tone(80,.4,'sawtooth',.07);game.shake=.4;updateHUD()}}
function blast(x,y){burst(x,y,'#ffd38b',36);game.shake=.12;for(const e of game.enemies)if(Math.hypot(e.x-x,e.y-y)<90+e.r)damageEnemy(e,4);if(game.boss&&Math.hypot(game.boss.x-x,game.boss.y-y)<90+game.boss.r)damageBoss(12);game.enemyShots=game.enemyShots.filter(p=>Math.hypot(p.x-x,p.y-y)>90);tone(110,.2,'sawtooth',.06)}
function fire(dt){const p=game.player;game.laserActive=false;const firing=held.fire.size||keys.has('Space')||keys.has('KeyJ');if(!firing||game.waveTimer>0)return;
 if(weapon==='laser'){if(game.energy>=40*dt){game.energy=Math.max(0,game.energy-40*dt);game.laserActive=true;for(const e of game.enemies)if(e.y<p.y&&Math.abs(e.x-p.x)<e.r+5)damageEnemy(e,20*dt);if(game.boss&&Math.abs(game.boss.x-p.x)<game.boss.r+5)damageBoss(17*dt);game.laserSound-=dt;if(game.laserSound<=0){tone(700,.04,'sine',.018);game.laserSound=.15}}return}
 if(game.cooldown>0)return;if(weapon==='grenade'&&game.grenades===0)return;
 if(weapon==='grenade'){game.grenades--;game.cooldown=.7;game.shots.push({x:p.x,y:p.y-20,prevY:p.y-20,vy:-H*.9,r:6,kind:'grenade'});tone(240,.1,'triangle')}
 else{game.cooldown=.16;game.shots.push({x:p.x-5,y:p.y-19,prevY:p.y-19,vy:-H*1.25,r:3,kind:'pulse',damage:1});tone(850,.035,'square',.018)}updateHUD()}
function update(dt){if(state!=='playing'||!game)return;const g=game,p=g.player,factor=prefs.difficulty==='chill'?.65:1;g.time+=dt;p.invincible=Math.max(0,p.invincible-dt);g.cooldown=Math.max(0,g.cooldown-dt);g.shake=Math.max(0,g.shake-dt);
 const move=Number(!!(held.right.size||keys.has('ArrowRight')||keys.has('KeyD')))-Number(!!(held.left.size||keys.has('ArrowLeft')||keys.has('KeyA')));if(move){p.x=clamp(p.x+move*320*dt,18,W-18);p.target=p.x}else p.x+= (p.target-p.x)*Math.min(1,dt*20);p.y=H-32;
 if(g.waveTimer>0){g.waveTimer-=dt;if(g.waveTimer<=0)$('message').hidden=true;return}
 fire(dt);if(!g.laserActive)g.energy=Math.min(100,g.energy+16*dt);
 const living=g.enemies.filter(e=>e.hp>0);if(living.length){let edge=false;const speed=(14+Math.min(g.wave,30)*3+(36-living.length)*.6)*factor;for(const e of living){e.x+=g.direction*speed*dt;e.flash=Math.max(0,e.flash-dt);if(e.x>W-22||e.x<22)edge=true}if(edge){g.direction*=-1;for(const e of living){e.x=clamp(e.x,22,W-22);e.y+=Math.min(18,H*.045)}}
 g.enemyTimer-=dt;if(g.enemyTimer<=0){const e=living[Math.floor(Math.random()*living.length)];const aimed=e.type==='scout';g.enemyShots.push({x:e.x,y:e.y+14,vx:aimed?clamp((p.x-e.x)*.55,-85,85):0,vy:H*(.2+Math.min(g.wave,25)*.012)*factor,r:4,color:e.type==='armored'?'#ffd38b':'#ff779c'});g.enemyTimer=random(.55,.95)/factor/Math.min(2,1+g.wave*.04)}
 if(living.some(e=>e.y+e.r>p.y-18)){hurtPlayer();if(state==='playing'){g.enemyShots=[];for(const e of living)e.y=Math.min(e.y,Math.max(40,H*.34));p.invincible=2.2}}}
 if(g.boss){const b=g.boss;b.t+=dt;b.x=W/2+Math.sin(b.t*.8)*150;b.timer-=dt;if(b.timer<=0){const phase=g.wave>=10?5:3;for(let i=0;i<phase;i++){g.enemyShots.push({x:b.x,y:b.y+30,vx:(i-(phase-1)/2)*52,vy:H*.32*factor,r:5,color:'#ff779c'})}b.timer=Math.max(.45,1.1-g.wave*.014)/factor}}
 for(const s of g.shots){s.prevY=s.y;s.y+=s.vy*dt;let hit=null;for(const e of g.enemies)if(e.hp>0&&Math.abs(e.x-s.x)<e.r+s.r&&s.y<=e.y+e.r&&s.prevY>=e.y-e.r){hit=e;break}const bossHit=g.boss&&Math.abs(g.boss.x-s.x)<g.boss.r+s.r&&s.y<=g.boss.y+25&&s.prevY>=g.boss.y-25;if(hit||bossHit){if(s.kind==='grenade')blast(s.x,hit?hit.y:g.boss.y);else if(hit)damageEnemy(hit,s.damage);else damageBoss(s.damage);s.dead=true}else if(s.y<0){if(s.kind==='grenade')blast(s.x,20);s.dead=true}}
 for(const b of g.enemyShots){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-p.x,b.y-p.y)<12+b.r){b.dead=true;hurtPlayer();if(state!=='playing')return}}
 for(const drop of g.drops){drop.y+=H*.14*dt;if(Math.hypot(drop.x-p.x,drop.y-p.y)<24){drop.dead=true;if(drop.kind==='repair')g.lives=Math.min(3,g.lives+1);else{g.grenades=Math.min(8,g.grenades+2);g.energy=100}tone(1000,.12);updateHUD()}}
 for(const a of g.particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}
 g.shots=g.shots.filter(s=>!s.dead);g.enemyShots=g.enemyShots.filter(s=>!s.dead&&s.y<H+15&&s.x>-20&&s.x<W+20);g.enemies=g.enemies.filter(e=>e.hp>0);g.drops=g.drops.filter(d=>!d.dead&&d.y<H+20);g.particles=g.particles.filter(a=>a.life>0);$('energy').textContent=Math.ceil(g.energy)+'% energy';if(g.boss)$('bosshealth').style.width=100*g.boss.hp/g.boss.maxHP+'%';if(!g.enemies.length&&!g.boss)nextWave()}
function ship(x,y,color){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(8,-4);ctx.lineTo(18,10);ctx.lineTo(18,15);ctx.lineTo(5,10);ctx.lineTo(0,14);ctx.lineTo(-5,10);ctx.lineTo(-18,15);ctx.lineTo(-18,10);ctx.lineTo(-8,-4);ctx.closePath();ctx.fill();ctx.fillStyle='#efffff';ctx.fillRect(-2,-7,4,10);ctx.restore()}
function enemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.flash>0?'#fff':e.type==='armored'?'#ffd38b':e.type==='drone'?'#b5a1ff':'#ff779c';const bob=Math.sin((game?.time||0)*3+e.phase)*2;ctx.translate(0,bob);if(e.type==='scout'){ctx.beginPath();ctx.moveTo(-14,-8);ctx.lineTo(0,-3);ctx.lineTo(14,-8);ctx.lineTo(10,6);ctx.lineTo(0,13);ctx.lineTo(-10,6);ctx.closePath();ctx.fill()}else{ctx.fillRect(-11,-9,22,17);ctx.fillRect(-17,-2,6,12);ctx.fillRect(11,-2,6,12);ctx.fillRect(-8,8,5,6);ctx.fillRect(3,8,5,6);ctx.fillRect(-10,-13,4,5);ctx.fillRect(6,-13,4,5)}ctx.fillStyle='#131629';ctx.fillRect(-7,-2,4,4);ctx.fillRect(3,-2,4,4);if(e.hp<e.maxHP){ctx.fillStyle='#ffffff99';ctx.fillRect(-12,-20,24*e.hp/e.maxHP,2)}ctx.restore()}
function draw(dt){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(game&&prefs.effects&&game.shake>0&&state==='playing')ctx.translate(random(-3,3),random(-3,3));
 for(const s of stars){if(state==='playing'||state==='menu')s.y=(s.y+dt*.025*s.z)%1;ctx.fillStyle='rgba(180,200,240,'+(s.z*.6)+')';ctx.fillRect(s.x*W,s.y*H,s.z<.6?1:2,s.z<.6?1:2)}
 ctx.strokeStyle='#6cf5dd10';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,H*.74);ctx.lineTo(W/2+(x-W/2)*1.8,H);ctx.stroke()}for(let y=H*.8;y<H;y+=H*.07){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 if(game){for(const e of game.enemies)enemy(e);if(game.boss){const b=game.boss;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#ff779c';ctx.beginPath();ctx.moveTo(-47,-10);ctx.lineTo(-27,-24);ctx.lineTo(27,-24);ctx.lineTo(47,-10);ctx.lineTo(40,18);ctx.lineTo(13,27);ctx.lineTo(0,17);ctx.lineTo(-13,27);ctx.lineTo(-40,18);ctx.closePath();ctx.fill();ctx.fillStyle='#27213a';ctx.fillRect(-22,-12,44,17);ctx.fillStyle='#fff0dc';ctx.fillRect(-15,-6,8,5);ctx.fillRect(7,-6,8,5);ctx.restore()}
 const p=game.player;if(game.laserActive&&state==='playing'){ctx.fillStyle='#6cf5dd22';ctx.fillRect(p.x-12,0,24,p.y-19);ctx.fillStyle='#6cf5dd';ctx.fillRect(p.x-4,0,8,p.y-19);ctx.fillStyle='#eafff9';ctx.fillRect(p.x-1,0,2,p.y-19)}
 for(const s of game.shots){ctx.fillStyle=s.kind==='grenade'?'#ffd38b':'#6cf5dd';if(s.kind==='grenade'){ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.fill()}else{ctx.fillRect(s.x-2,s.y-9,4,15);ctx.fillStyle='#6cf5dd22';ctx.fillRect(s.x-4,s.y+6,8,13)}}
 for(const s of game.enemyShots){ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 for(const d of game.drops){ctx.strokeStyle=d.kind==='repair'?'#ff779c':'#ffd38b';ctx.strokeRect(d.x-9,d.y-9,18,18);ctx.fillStyle=ctx.strokeStyle;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(d.kind==='repair'?'+':'ϟ',d.x,d.y+5)}
 for(const a of game.particles){ctx.globalAlpha=a.life/a.max;ctx.fillStyle=a.color;ctx.fillRect(a.x,a.y,3,3)}ctx.globalAlpha=1;
 if(p.invincible<=0||Math.floor(game.time*12)%2===0){if(p.invincible>0){ctx.strokeStyle='#6cf5dd55';ctx.beginPath();ctx.arc(p.x,p.y,26,0,Math.PI*2);ctx.stroke()}ship(p.x,p.y,'#6cf5dd');ctx.fillStyle='#b5a1ff';ctx.beginPath();ctx.moveTo(p.x-5,p.y+14);ctx.lineTo(p.x,p.y+22+(prefs.effects?Math.sin(game.time*40)*4:0));ctx.lineTo(p.x+5,p.y+14);ctx.fill()}}
 else ship(W/2,H-40,'#6cf5dd');ctx.restore()}
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw(dt);requestAnimationFrame(loop)}
for(const name of ['left','right','fire']){const b=$(name);b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing')return;held[name].add(e.pointerId);b.setPointerCapture(e.pointerId);b.classList.add('held');if(name==='fire')tone(650,.02)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{held[name].delete(e.pointerId);if(!held[name].size)b.classList.remove('held')})}
function coordinate(e){const r=canvas.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing'||drag)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:coordinate(e),target:game.player.x};game.player.target=clamp(coordinate(e),18,W-18);drag.target=game.player.target});canvas.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId&&state==='playing'){e.preventDefault();game.player.target=clamp(drag.target+(coordinate(e)-drag.x)*prefs.sensitivity,18,W-18)}});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{if(drag?.id===e.pointerId)drag=null});
document.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>chooseWeapon(b.dataset.weapon));$('pause').onclick=()=>{if(state==='playing')pause();else if(screen==='paused')resume()};$('settings').onclick=openSettings;
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(state==='playing'&&['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyJ'].includes(e.code)){e.preventDefault();keys.add(e.code)}if(!e.repeat){if(e.code==='Escape'||e.code==='KeyP'){if(state==='playing')pause();else if(screen==='paused')resume()}if(state==='playing'&&['Digit1','Digit2','Digit3'].includes(e.code))chooseWeapon(['pulse','grenade','laser'][Number(e.code.slice(-1))-1])}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{clearInput();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(state==='playing')pause()}});
$('overlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const all=[...$('card').querySelectorAll('button,input,select')].filter(el=>!el.disabled),first=all[0],end=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus()}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus()}});
applyPrefs();$('best').textContent=String(best).padStart(6,'0');resize();menu();requestAnimationFrame(loop);
})();
</script>
